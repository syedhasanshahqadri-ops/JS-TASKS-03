<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS TASKS-03 [ ELITE CODERS ]</title>
    <style>
:root {
    --bg1: #0b0720;
    --bg2: #1a0f3d;
    --text: #f3f0ff;
    --muted: #a99ed6;
    --accent1: #00e5ff;
    --accent2: #8b5cf6;
    --accent3: #ff3d9a;
    --card: rgba(255, 255, 255, 0.07);
    --card-border: rgba(255, 255, 255, 0.18);
    --shadow: rgba(0, 0, 0, 0.55);
    --cube-face: rgba(139, 92, 246, 0.16);
    --cube-line: rgba(0, 229, 255, 0.6);
    --grid: rgba(139, 92, 246, 0.35);
}

[data-theme="light"] {
    --bg1: #f6f3ff;
    --bg2: #dfe9ff;
    --text: #1b1340;
    --muted: #5d548f;
    --accent1: #0891b2;
    --accent2: #6d28d9;
    --accent3: #db2777;
    --card: rgba(255, 255, 255, 0.7);
    --card-border: rgba(109, 40, 217, 0.25);
    --shadow: rgba(60, 40, 140, 0.25);
    --cube-face: rgba(109, 40, 217, 0.1);
    --cube-line: rgba(8, 145, 178, 0.7);
    --grid: rgba(109, 40, 217, 0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
    background-size: 300% 300%;
    animation: bgShift 16s ease infinite;
    overflow-x: hidden;
    display: grid;
    place-items: center;
    transition: color 0.4s ease;
}

@keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* ---------- 3D background scene ---------- */
.scene {
    position: fixed;
    inset: 0;
    perspective: 900px;
    pointer-events: none;
    overflow: hidden;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    animation: float 9s ease-in-out infinite;
}
.orb-a { width: 380px; height: 380px; background: var(--accent2); top: -80px; left: -80px; }
.orb-b { width: 320px; height: 320px; background: var(--accent3); bottom: -60px; right: -60px; animation-delay: -4s; }

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 30px) scale(1.12); }
}

.grid-floor {
    position: absolute;
    left: -50%;
    width: 200%;
    height: 70%;
    bottom: -10%;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: rotateX(72deg);
    transform-origin: center bottom;
    animation: gridMove 4s linear infinite;
    mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
}

@keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to { background-position: 0 60px, 60px 0; }
}

.cube {
    --s: 70px;
    position: absolute;
    width: var(--s);
    height: var(--s);
    transform-style: preserve-3d;
    animation: spin 14s linear infinite;
}
.cube i {
    position: absolute;
    inset: 0;
    background: var(--cube-face);
    border: 1.5px solid var(--cube-line);
    box-shadow: 0 0 18px var(--cube-line) inset;
}
.cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

.c1 { top: 14%; left: 12%; }
.c2 { --s: 50px; top: 62%; left: 80%; animation-duration: 10s; animation-direction: reverse; }
.c3 { --s: 90px; top: 20%; left: 82%; animation-duration: 20s; }

@keyframes spin {
    from { transform: rotateX(0) rotateY(0) rotateZ(0); }
    to { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
}

/* ---------- Main content ---------- */
.stage {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 20px;
    perspective: 1000px;
}

h1 {
    position: relative;
    font-size: clamp(2.6rem, 9vw, 6rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both, shine 6s linear infinite;
    filter: drop-shadow(0 10px 18px var(--shadow));
    transform-style: preserve-3d;
}

@keyframes titleIn {
    from { opacity: 0; transform: rotateX(80deg) translateY(-40px); }
    to { opacity: 1; transform: rotateX(0) translateY(0); }
}
@keyframes shine {
    to { background-position: 300% 0; }
}

.sub {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1.1rem;
    letter-spacing: 2px;
    animation: fadeUp 1s 0.5s both;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

.cards {
    list-style: none;
    margin-top: 56px;
    display: flex;
    gap: 36px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    width: 260px;
    height: 170px;
    perspective: 800px;
    animation: cardIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
.card:nth-child(1) { animation-delay: 0.7s; }
.card:nth-child(2) { animation-delay: 0.9s; }

@keyframes cardIn {
    from { opacity: 0; transform: translateY(70px) rotateX(-50deg); }
    to { opacity: 1; transform: translateY(0) rotateX(0); }
}

.card a {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 40px var(--shadow);
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.15s ease-out, box-shadow 0.3s ease;
    overflow: hidden;
}

.card a::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from var(--angle, 0deg), var(--accent1), var(--accent2), var(--accent3), var(--accent1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: border 5s linear infinite;
    opacity: 0.85;
}

@property --angle {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
}
@keyframes border { to { --angle: 360deg; } }

.card .glow {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent2), transparent 65%);
    left: var(--mx, 50%);
    top: var(--my, 50%);
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.card .name {
    position: relative;
    z-index: 2;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 3px;
    transform: translateZ(60px);
    text-shadow: 0 8px 18px var(--shadow);
}

.card a:hover { box-shadow: 0 30px 60px var(--shadow), 0 0 40px var(--accent2); }
.card a:hover .glow { opacity: 0.55; }
.card a:active { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(0.96); }
.card a:focus-visible { outline: 3px solid var(--accent1); outline-offset: 4px; }

/* ---------- Theme toggle ---------- */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px 6px 6px;
    border-radius: 40px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font: 600 0.9rem "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 22px var(--shadow);
    transition: transform 0.2s ease;
}
.theme-toggle:hover { transform: translateY(-2px) scale(1.04); }
.theme-toggle:focus-visible { outline: 3px solid var(--accent1); outline-offset: 3px; }

.theme-toggle .knob {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--accent1) 45%, var(--accent2));
    box-shadow: 0 0 14px var(--accent1);
    transition: transform 0.5s cubic-bezier(0.3, 1.5, 0.5, 1);
}
[data-theme="light"] .theme-toggle .knob {
    background: radial-gradient(circle at 30% 30%, #fff7c2, #ffb300 55%, #ff6d00);
    box-shadow: 0 0 16px #ffb300;
    transform: rotate(180deg);
}

@media (max-width: 560px) {
    .cards { gap: 24px; }
    .card { width: 100%; max-width: 300px; }
    .cube { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}

    </style>
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grid-floor"></div>
        <div class="cube c1"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="cube c2"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="cube c3"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
        <span class="knob"></span>
        <span class="label" id="themeLabel">Dark</span>
    </button>

    <main class="stage">
        <h1 data-text="JS TASKS-03">JS TASKS-03</h1>
        <p class="sub">Pick a task to open it</p>

        <ul class="cards">
            <li class="card"><a href="task1.html"><span class="name">task-1</span><span class="glow"></span></a></li>
            <li class="card"><a href="task2.html"><span class="name">task-2</span><span class="glow"></span></a></li>
        </ul>
    </main>

    <script>
(function () {
    "use strict";

    /* ---------- Theme toggle (remembers choice) ---------- */
    var root = document.documentElement;
    var toggle = document.getElementById("themeToggle");
    var label = document.getElementById("themeLabel");

    function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        label.textContent = theme === "dark" ? "Dark" : "Light";
        try { localStorage.setItem("js-tasks-theme", theme); } catch (e) {}
    }

    var saved = null;
    try { saved = localStorage.getItem("js-tasks-theme"); } catch (e) {}
    if (!saved) {
        saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    applyTheme(saved);

    toggle.addEventListener("click", function () {
        applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    /* ---------- 3D tilt + glow that follows the cursor ---------- */
    var cards = document.querySelectorAll(".card a");
    var maxTilt = 18;

    cards.forEach(function (card) {
        card.addEventListener("mousemove", function (e) {
            var r = card.getBoundingClientRect();
            var x = e.clientX - r.left;
            var y = e.clientY - r.top;
            var rx = ((y / r.height) - 0.5) * -2 * maxTilt;
            var ry = ((x / r.width) - 0.5) * 2 * maxTilt;
            card.style.setProperty("--rx", rx.toFixed(2) + "deg");
            card.style.setProperty("--ry", ry.toFixed(2) + "deg");
            card.style.setProperty("--mx", x + "px");
            card.style.setProperty("--my", y + "px");
        });

        card.addEventListener("mouseleave", function () {
            card.style.setProperty("--rx", "0deg");
            card.style.setProperty("--ry", "0deg");
        });
    });

    /* ---------- Background parallax (mouse moves the 3D scene) ---------- */
    var scene = document.querySelector(".scene");
    window.addEventListener("mousemove", function (e) {
        var px = (e.clientX / window.innerWidth - 0.5) * 2;
        var py = (e.clientY / window.innerHeight - 0.5) * 2;
        scene.style.transform = "rotateY(" + (px * 4) + "deg) rotateX(" + (-py * 4) + "deg)";
    });
})();

    </script>
</body>
</html>
